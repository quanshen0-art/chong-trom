<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">智能防盜監控中心 - ESP32-S3 聯動</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-color: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 5px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }

        .esp-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 13px;
        }
        .esp-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .esp-box input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 13px;
        }
        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
            background: #475569;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .esp-state {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 12px;
        }

        .video-container {
            position: relative;
            display: inline-block;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 2px solid #334155;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button.main-btn {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent-color); }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: var(--success-color); }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger-color); }
        .btn-danger:hover { background: #dc2626; }

        .lang-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .lang-btn {
            background: #334155;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .samples-section {
            margin-top: 15px;
            text-align: left;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
        .samples-title { font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .thumbnails {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid var(--success-color);
            flex-shrink: 0;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #fbbf24;
            font-size: 14px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Đa ngôn ngữ -->
        <div class="lang-group">
            <button class="lang-btn" onclick="switchLanguage('zh')">🇹🇼 繁體</button>
            <button class="lang-btn" onclick="switchLanguage('vi')">🇻🇳 Tiếng Việt</button>
            <button class="lang-btn" onclick="switchLanguage('en')">🇬🇧 English</button>
        </div>

        <h2 id="main-heading">🛡️ 智能防盜監控中心</h2>
        <p id="instruction">步驟 1：請面向鏡頭拍攝多張不同角度或服飾的主人照片以提高識別度。</p>

        <!-- Kết nối trạng thái ESP32-S3 -->
        <div class="esp-box">
            <label for="espIpInput" id="esp-label"><strong>ESP32-S3 IP (Wi-Fi Shen):</strong></label>
            <div class="esp-row">
                <input type="text" id="espIpInput" placeholder="Ví dụ: 192.168.1.50">
                <button class="btn-small" id="btnSync" onclick="saveAndPollEsp()">同步</button>
            </div>
            <div class="esp-state" id="espSyncState">ESP32 同步：未設定 IP（可手動切換警戒狀態）</div>
        </div>

        <div class="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <canvas id="hiddenCanvas" width="160" height="120" style="display:none;"></canvas>

        <!-- Danh sách ảnh mẫu đã lưu -->
        <div class="samples-section">
            <div class="samples-title" id="samples-label">已保存的主人樣本圖片 (0 張):</div>
            <div class="thumbnails" id="thumbnailContainer"></div>
        </div>

        <div class="controls">
            <button id="btnCapture" class="main-btn btn-primary" onclick="captureOwnerSample()">📸 拍攝並新增主人照片</button>
            <button id="btnArm" class="main-btn btn-success" onclick="toggleSystem()" style="display:none;">🚨 啟動防盜警戒模式</button>
        </div>

        <div id="status">相機就緒，請先拍攝至少 1 張主人照片！</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const btnCapture = document.getElementById('btnCapture');
        const btnArm = document.getElementById('btnArm');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const espIpInput = document.getElementById('espIpInput');
        const espSyncState = document.getElementById('espSyncState');

        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558912856559460404/ARuaFNfuLUFYp3kS_XOf8NQrI85ZH0Nkw1FEHxvLrjxPbC2KDgfGAduANrgrV74Y4A57";

        let ownerSamples = [];
        let isArmed = false;
        let lastSentTime = 0;
        let watchInterval = null;
        let espPollInterval = null;
        let espIp = localStorage.getItem('esp32_ip') || "";
        let currentLang = 'zh';

        if (espIp) {
            espIpInput.value = espIp;
        }

        const langData = {
            zh: {
                title: "智能防盜監控中心 - ESP32-S3 聯動",
                heading: "🛡️ 智能防盜監控中心",
                step1: "步驟 1：請面向鏡頭拍攝多張不同角度或服飾的主人照片以提高識別度。",
                step2: "步驟 2：已收集足夠樣本，隨時可以啟動防盜警戒模式。",
                armedDesc: "🚨 防盜警戒中！檢測到陌生人或 ESP32 震動將自動拍照發送至 Discord。",
                btnCapture: "📸 拍攝並新增主人照片",
                btnArmOn: "🚨 啟動防盜警戒模式",
                btnArmOff: "🛑 關閉防盜警戒模式",
                samplesLabel: "已保存的主人樣本圖片",
                ready: "相機就緒，請先拍攝至少 1 張主人照片！",
                captured: "✅ 成功新增 1 張主人照片！您可以繼續切換角度拍攝多張。",
                needSample: "請先拍攝至少 1 張主人照片才能啟動！",
                strangerAlert: "🚨 發現陌生人！正在拍照並發送警告...",
                motionAlert: "🚨 ESP32 偵測到震動！正在拍照並發送至 Discord...",
                sentSuccess: "🚨 照片已成功發送至 Discord！",
                netError: "❌ 網絡錯誤: ",
                syncBtn: "同步",
                espDisconnected: "ESP32 同步：無法連線（可能受 HTTPS 混合內容限制或未在同一 Wi-Fi）",
                espArmed: "ESP32 同步：已連線（RFID 狀態：已開啟警戒）",
                espDisarmed: "ESP32 同步：已連線（RFID 狀態：已解除警戒）"
            },
            vi: {
                title: "Trung Tâm Chống Trộm - Kết Hợp ESP32-S3",
                heading: "🛡️ Trạm Chống Trộm Thông Minh",
                step1: "Bước 1: Chụp nhiều bức ảnh ở các góc độ hoặc trang phục khác nhau để làm mẫu chủ nhân.",
                step2: "Bước 2: Đã có ảnh mẫu, bạn có thể bật chế độ chống trộm.",
                armedDesc: "🚨 ĐANG CẠNH GÁC! Phát hiện người lạ hoặc rung lắc từ ESP32 sẽ chụp ảnh gửi Discord.",
                btnCapture: "📸 Chụp & Thêm Ảnh Chủ Nhân",
                btnArmOn: "🚨 Bật Chế Độ Chống Trộm",
                btnArmOff: "🛑 Tắt Chế Độ Chống Trộm",
                samplesLabel: "Danh sách ảnh mẫu chủ nhân đã lưu",
                ready: "Camera đã sẵn sàng, hãy chụp ít nhất 1 ảnh mẫu chủ nhân!",
                captured: "✅ Đã thêm 1 ảnh mẫu thành công! Bạn có thể chụp thêm góc độ khác.",
                needSample: "Vui lòng chụp ít nhất 1 ảnh mẫu chủ nhân trước khi bật!",
                strangerAlert: "🚨 PHÁT HIỆN NGƯỜI LẠ! Đang chụp ảnh và gửi cảnh báo...",
                motionAlert: "🚨 ESP32 PHÁT HIỆN RUNG LẮC! Đang chụp ảnh gửi Discord...",
                sentSuccess: "🚨 Đã gửi ảnh về Discord thành công!",
                netError: "❌ Lỗi mạng: ",
                syncBtn: "Đồng bộ",
                espDisconnected: "ESP32: Chưa kết nối được (kiểm tra IP cùng Wi-Fi Shen hoặc mở trực tiếp file nếu bị chặn HTTPS)",
                espArmed: "ESP32: Đã kết nối (RFID: ĐANG BẬT CHỐNG TRỘM)",
                espDisarmed: "ESP32: Đã kết nối (RFID: ĐÃ TẮT CHỐNG TRỘM)"
            },
            en: {
                title: "Smart Anti-Theft - ESP32-S3 Sync",
                heading: "🛡️ Smart Anti-Theft Center",
                step1: "Step 1: Take multiple photos of yourself at different angles or outfits.",
                step2: "Step 2: Samples collected, ready to arm the security system.",
                armedDesc: "🚨 ARMED! Strangers or ESP32 motion will trigger a Discord photo alert.",
                btnCapture: "📸 Capture & Add Owner Photo",
                btnArmOn: "🚨 Arm Security System",
                btnArmOff: "🛑 Disarm System",
                samplesLabel: "Saved Owner Sample Photos",
                ready: "Camera ready, please capture at least 1 owner sample!",
                captured: "✅ Owner photo added! You can capture more from different angles.",
                needSample: "Please capture at least 1 owner photo first!",
                strangerAlert: "🚨 STRANGER DETECTED! Taking photo and sending alert...",
                motionAlert: "🚨 ESP32 MOTION DETECTED! Capturing photo for Discord...",
                sentSuccess: "🚨 Snapshot sent to Discord!",
                netError: "❌ Network error: ",
                syncBtn: "Sync",
                espDisconnected: "ESP32: Unreachable (check same Wi-Fi or HTTPS mixed-content block)",
                espArmed: "ESP32: Connected (RFID Status: ARMED)",
                espDisarmed: "ESP32: Connected (RFID Status: DISARMED)"
            }
        };

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('page-title').innerText = langData[lang].title;
            document.getElementById('main-heading').innerText = langData[lang].heading;
            document.getElementById('btnSync').innerText = langData[lang].syncBtn;
            document.getElementById('samples-label').innerText = langData[lang].samplesLabel + ` (${ownerSamples.length}):`;
            btnCapture.innerText = langData[lang].btnCapture;
            if (isArmed) {
                btnArm.innerText = langData[lang].btnArmOff;
                statusDiv.innerText = langData[lang].armedDesc;
            } else if (ownerSamples.length > 0) {
                document.getElementById('instruction').innerText = langData[lang].step2;
                btnArm.innerText = langData[lang].btnArmOn;
            } else {
                document.getElementById('instruction').innerText = langData[lang].step1;
            }
        }

        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                statusDiv.innerText = "Camera Error: " + err;
            }
        }
        startVideo();

        function captureOwnerSample() {
            hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const imgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            ownerSamples.push(imgData.data);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = hiddenCanvas.width;
            tempCanvas.height = hiddenCanvas.height;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

            const imgThumb = document.createElement('img');
            imgThumb.src = tempCanvas.toDataURL();
            imgThumb.className = 'thumbnail';
            thumbnailContainer.appendChild(imgThumb);

            document.getElementById('samples-label').innerText = langData[currentLang].samplesLabel + ` (${ownerSamples.length}):`;
            statusDiv.innerText = langData[currentLang].captured;
            btnArm.style.display = "block";
            if (!isArmed) {
                document.getElementById('instruction').innerText = langData[currentLang].step2;
                btnArm.innerText = langData[currentLang].btnArmOn;
            }
        }

        function setArmedState(newState) {
            if (newState && ownerSamples.length === 0) {
                return;
            }
            if (isArmed === newState) return;

            isArmed = newState;
            if (isArmed) {
                btnArm.innerText = langData[currentLang].btnArmOff;
                btnArm.className = "main-btn btn-danger";
                statusDiv.innerText = langData[currentLang].armedDesc;
                document.getElementById('instruction').innerText = langData[currentLang].armedDesc;
                clearInterval(watchInterval);
                watchInterval = setInterval(compareWithAllSamples, 1000);
            } else {
                btnArm.innerText = langData[currentLang].btnArmOn;
                btnArm.className = "main-btn btn-success";
                statusDiv.innerText = langData[currentLang].ready;
                document.getElementById('instruction').innerText = langData[currentLang].step2;
                clearInterval(watchInterval);
            }
        }

        function toggleSystem() {
            if (ownerSamples.length === 0) {
                alert(langData[currentLang].needSample);
                return;
            }
            setArmedState(!isArmed);
        }

        function compareWithAllSamples() {
            if (!isArmed || ownerSamples.length === 0) return;

            hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const currentImgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const currentPixels = currentImgData.data;
            const totalPixels = hiddenCanvas.width * hiddenCanvas.height;

            let matchedAny = false;

            for (let sample of ownerSamples) {
                let diffCount = 0;
                for (let i = 0; i < currentPixels.length; i += 4) {
                    const rDiff = Math.abs(currentPixels[i] - sample[i]);
                    const gDiff = Math.abs(currentPixels[i+1] - sample[i+1]);
                    const bDiff = Math.abs(currentPixels[i+2] - sample[i+2]);
                    if ((rDiff + gDiff + bDiff) / 3 > 45) {
                        diffCount++;
                    }
                }
                if (diffCount <= totalPixels * 0.35) {
                    matchedAny = true;
                    break;
                }
            }

            if (!matchedAny) {
                let currentTime = Date.now();
                if (currentTime - lastSentTime > 15000) {
                    lastSentTime = currentTime;
                    takePhotoAndSend("🚨 **CẢNH BÁO CHỐNG TRỘM:** Phát hiện người lạ không khớp với ảnh mẫu lúc ");
                }
            }
        }

        function takePhotoAndSend(prefixText) {
            statusDiv.innerText = langData[currentLang].strangerAlert;
            canvas.width = 320;
            canvas.height = 240;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'security_snapshot.jpg');
                formData.append('payload_json', JSON.stringify({
                    content: prefixText + new Date().toLocaleTimeString() + "!"
                }));

                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        statusDiv.innerText = langData[currentLang].sentSuccess;
                    }
                })
                .catch(error => {
                    statusDiv.innerText = langData[currentLang].netError + error;
                });
            }, 'image/jpeg');
        }

        function saveAndPollEsp() {
            const rawIp = espIpInput.value.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
            espIp = rawIp;
            localStorage.setItem('esp32_ip', espIp);
            clearInterval(espPollInterval);
            if (!espIp) {
                espSyncState.innerText = "ESP32: Đã xóa IP";
                return;
            }
            pollEspStatus();
            espPollInterval = setInterval(pollEspStatus, 2000);
        }

        async function pollEspStatus() {
            if (!espIp) return;
            try {
                const res = await fetch(`http://${espIp}/status`, { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                espSyncState.innerText = data.armed ? langData[currentLang].espArmed : langData[currentLang].espDisarmed;
                setArmedState(Boolean(data.armed));

                if (data.armed && data.motion) {
                    let now = Date.now();
                    if (now - lastSentTime > 8000) {
                        lastSentTime = now;
                        statusDiv.innerText = langData[currentLang].motionAlert;
                        takePhotoAndSend("🚨 **CẢNH BÁO RUNG LẮC (ESP32-S3 MPU6050):** Phát hiện chuyển động/va chạm lúc ");
                    }
                }
            } catch (err) {
                espSyncState.innerText = langData[currentLang].espDisconnected;
            }
        }

        if (espIp) {
            espPollInterval = setInterval(pollEspStatus, 2000);
        }
    </script>
</body>
</html>

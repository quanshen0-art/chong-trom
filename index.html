<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chống Trộm Nhận Diện Khuôn Mặt</title>
    <!-- Tải thư viện nhận diện khuôn mặt từ cdnjs -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 20px; padding: 10px; }
        .video-container { position: relative; display: inline-block; }
        video, canvas { display: block; margin: 10px auto; border-radius: 10px; max-width: 100%; border: 2px solid #333; }
        button { padding: 12px 24px; font-size: 16px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #219653; }
        #status { margin-top: 15px; font-weight: bold; color: #f1c40f; font-size: 16px; }
    </style>
</head>
<body>

    <h2>🛡️ Trạm Chống Trộm Thông Minh (Nhận Diện Chủ Nhân)</h2>
    <p id="instruction">Bước 1: Nhìn vào camera và bấm nút để lưu khuôn mặt chủ nhân.</p>

    <div class="video-container">
        <video id="webcam" autoplay playsinline width="320" height="240"></video>
    </div>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <div>
        <button id="btnTrain" onclick="dangKyChuNhan()">Đăng Ký Tôi Là Chủ Nhân</button>
        <button id="btnArm" onclick="batCheDoChongTrom()" style="background: #e74c3c; display:none;">Bật Chế Độ Chống Trộm</button>
    </div>

    <div id="status">Đang tải mô hình nhận diện khuôn mặt...</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const btnTrain = document.getElementById('btnTrain');
        const btnArm = document.getElementById('btnArm');

        // 👉 DÁN ĐƯỜNG DẪN DISCORD WEBHOOK CỦA BẠN VÀO ĐÂY
        const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        let labeledFaceDescriptors = null;
        let faceMatcher = null;
        let isArmed = false;
        let lastSentTime = 0;

        // Tải các mô hình AI nhận diện khuôn mặt từ thư mục công khai của face-api.js
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
            faceapi.nets.faceLandmarkNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
            faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')
        ]).then(startVideo);

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "Camera đã sẵn sàng. Hãy đăng ký khuôn mặt chủ nhân!";
                })
                .catch(err => {
                    statusDiv.innerText = "Lỗi truy cập camera: " + err;
                });
        }

        // Bước 1: Lưu khuôn mặt của bạn làm chủ nhân
        async function dangKyChuNhan() {
            statusDiv.innerText = "Đang quét khuôn mặt chủ nhân...";
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (!detection) {
                alert("Không tìm thấy khuôn mặt! Hãy đưa mặt lại gần camera hơn.");
                statusDiv.innerText = "Không tìm thấy khuôn mặt, vui lòng thử lại.";
                return;
            }

            labeledFaceDescriptors = new faceapi.LabeledFaceDescriptors('ChuNhan', [detection.descriptor]);
            faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.6);
            
            statusDiv.innerText = "✅ Đã ghi nhận khuôn mặt chủ nhân thành công!";
            btnTrain.style.display = "none";
            btnArm.style.display = "inline-block";
            document.getElementById('instruction').innerText = "Bước 2: Bấm nút bên dưới để kích hoạt hệ thống gác cửa.";
        }

        // Bước 2: Bật chế độ canh gác tự động
        function batCheDoChongTrom() {
            isArmed = true;
            btnArm.style.display = "none";
            statusDiv.innerText = "🚨 HỆ THỐNG CHỐNG TRỘM ĐANG BẬT! Đang giám sát...";
            document.getElementById('instruction').innerText = "Hệ thống đang chạy ngầm. Nếu có người lạ xuất hiện, ảnh sẽ tự động gửi về Discord.";

            // Vòng lặp quét liên tục mỗi giây
            setInterval(async () => {
                if (!isArmed || !faceMatcher) return;

                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                
                if (detections.length > 0) {
                    let hasStranger = false;

                    for (const det of detections) {
                        const bestMatch = faceMatcher.findBestMatch(det.descriptor);
                        // Nếu phát hiện khuôn mặt không khớp với 'ChuNhan' (tên nhãn là 'unknown')
                        if (bestMatch.label === 'unknown') {
                            hasStranger = true;
                            break;
                        }
                    }

                    if (hasStranger) {
                        let currentTime = Date.now();
                        // Khoảng cách 15 giây mới gửi 1 lần để tránh spam thông báo
                        if (currentTime - lastSentTime > 15000) {
                            lastSentTime = currentTime;
                            chupVaGuiDiscord();
                        }
                    }
                }
            }, 1000);
        }

        // Tự động chụp và gửi Discord khi phát hiện người lạ
        function chupVaGuiDiscord() {
            statusDiv.innerText = "🚨 PHÁT HIỆN NGƯỜI LẠ! Đang chụp ảnh và gửi cảnh báo...";
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'ke_la_mat.jpg');
                formData.append('payload_json', JSON.stringify({
                    content: "🚨 **CẢNH BÁO CHỐNG TRỘM:** Phát hiện người lạ không phải chủ nhân tiếp cận khu vực giám sát lúc " + new Date().toLocaleTimeString() + "!"
                }));

                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        statusDiv.innerText = "🚨 Đã gửi ảnh kẻ lạ về Discord thành công! Tiếp tục giám sát...";
                    } else {
                        statusDiv.innerText = "⚠️ Lỗi khi gửi ảnh lên Discord.";
                    }
                })
                .catch(error => {
                    statusDiv.innerText = "❌ Lỗi mạng: " + error;
                });
            }, 'image/jpeg');
        }
    </script>

</body>
</html>

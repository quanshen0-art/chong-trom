<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trạm Chống Trộm - iPhone</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#3b82f6;--ok:#10b981;--bad:#ef4444;--txt:#f8fafc}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;background:var(--bg);color:var(--txt);margin:0;padding:20px}
.container{max-width:480px;margin:0 auto;background:var(--card);padding:20px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
h2{margin:0 0 5px;font-size:22px}
p{color:#94a3b8;font-size:14px;margin:0 0 16px}
.box{background:#0f172a;padding:10px;border-radius:8px;margin-bottom:12px;text-align:left;font-size:13px}
.box input{width:100%;box-sizing:border-box;margin-top:6px;padding:9px 10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:16px}
.state{color:#94a3b8;font-size:12px;margin-top:6px}
.video-container{width:100%;border-radius:12px;overflow:hidden;background:#000;border:2px solid #334155}
video,canvas{width:100%;height:auto;display:block}
.controls{margin-top:15px;display:flex;flex-direction:column;gap:10px}
.main-btn{padding:14px;font-size:16px;font-weight:bold;color:#fff;border:none;border-radius:10px;cursor:pointer}
.btn-primary{background:var(--accent)}.btn-success{background:var(--ok)}.btn-danger{background:var(--bad)}.btn-grey{background:#475569}
.lang-group{margin-bottom:15px;display:flex;justify-content:center;gap:5px}
.lang-btn{background:#334155;font-size:12px;padding:6px 10px;border-radius:6px;color:#fff;border:none}
.thumbnails{display:flex;gap:8px;overflow-x:auto;padding:5px 0}
.thumbnail{width:50px;height:50px;border-radius:6px;object-fit:cover;border:2px solid var(--ok);flex-shrink:0}
#status{margin-top:15px;font-weight:bold;color:#fbbf24;font-size:14px;padding:10px;background:#0f172a;border-radius:8px}
</style>
</head>
<body>
<div class="container">
  <div class="lang-group">
    <button class="lang-btn" onclick="setLang('zh')">🇹🇼 繁體</button>
    <button class="lang-btn" onclick="setLang('vi')">🇻🇳 Tiếng Việt</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
  </div>
  <h2 id="heading"></h2>
  <p id="instruction"></p>

  <div class="box">
    <label id="lblKey"></label>
    <input type="password" id="roomKey" autocomplete="off">
    <label id="lblHook" style="display:block;margin-top:8px"></label>
    <input type="password" id="webhook" autocomplete="off" placeholder="https://discord.com/api/webhooks/...">
    <button class="main-btn btn-grey" id="btnSave" onclick="saveSettings()" style="width:100%;margin-top:10px;padding:10px;font-size:14px"></button>
    <div class="state" id="espState"></div>
    <div class="state" id="aiState"></div>
  </div>

  <div class="video-container"><video id="webcam" autoplay playsinline muted></video></div>
  <canvas id="canvas" style="display:none"></canvas>
  <canvas id="thumbCanvas" width="120" height="120" style="display:none"></canvas>

  <div class="box" style="margin-top:12px">
    <div id="samplesLabel" style="color:#94a3b8"></div>
    <div class="thumbnails" id="thumbs"></div>
  </div>

  <div class="controls">
    <button id="btnFlip" class="main-btn btn-grey" onclick="flipCamera()"></button>
    <button id="btnCapture" class="main-btn btn-primary" onclick="captureOwnerSample()"></button>
    <button id="btnArm" class="main-btn btn-success" onclick="toggleSystem()" style="display:none"></button>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const FACE_THRESHOLD = 0.55;  // nhỏ hơn = khắt khe hơn (0.45 ~ 0.6). Hay báo nhầm chủ -> tăng lên
const GRACE_MS = 45000;       // sau khi thấy mặt chủ nhân, bỏ qua cảnh báo trong 45 giây

const video = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const thumbCanvas = document.getElementById('thumbCanvas');
const statusDiv = document.getElementById('status');
const btnArm = document.getElementById('btnArm');

let ownerDescriptors = [];
let isArmed = false, espArmed = false, espOnline = false;
let lastSentTime = 0, watchInterval = null, currentLang = 'vi';
let facing = 'user', stream = null, wakeLock = null;
let client = null, T = {};
let roomKey = '', webhook = '';
let modelsReady = false, scanning = false, ownerLastSeen = 0, aiMsg = 'loading';

try { roomKey = localStorage.getItem('roomKey') || ''; webhook = localStorage.getItem('webhook') || ''; } catch (e) {}
document.getElementById('roomKey').value = roomKey;
document.getElementById('webhook').value = webhook;

const L = {
  zh: { heading:"🛡️ 智能防盜監控中心", step1:"步驟 1：請拍攝主人臉部照片（正面、左側、右側各一張）。", step2:"步驟 2：已有樣本，可啟動警戒。", armedDesc:"🚨 警戒中！偵測到陌生人或 ESP32 震動將拍照發送至 Discord。", btnCapture:"📸 拍攝並新增主人臉部", btnArmOn:"🚨 啟動警戒模式", btnArmOff:"🛑 關閉警戒模式", samples:"已保存的主人臉部樣本", ready:"相機就緒，請先拍攝至少 1 張主人臉部！", captured:"✅ 已新增主人臉部樣本！", noFace:"❌ 沒有偵測到臉部，請正對鏡頭再試一次", needSample:"請先拍攝至少 1 張主人臉部！", needHook:"請先填入 Discord Webhook！", stranger:"🚨 發現陌生人！正在發送...", motion:"🚨 偵測到異常！正在發送...", ownerMoving:"✅ 主人剛剛出現，已忽略", sent:"🚨 照片已發送至 Discord！", netErr:"❌ 網絡錯誤: ", online:"ESP32：在線", offline:"ESP32：離線 / 未連線", on:"（警戒中）", off:"（已解除）", key:"房間代碼（需與 ESP32 相同）", hook:"Discord Webhook", save:"儲存並連線", flip:"🔄 切換前後鏡頭", ai_loading:"AI：載入臉部模型中...", ai_ready:"AI：臉部辨識已就緒", ai_fail:"AI：模型載入失敗，請檢查網路" },
  vi: { heading:"🛡️ Trạm Chống Trộm Thông Minh", step1:"Bước 1: Chụp mặt chủ nhân (nên chụp chính diện, nghiêng trái, nghiêng phải mỗi góc 1 ảnh).", step2:"Bước 2: Đã có ảnh mẫu, có thể bật chế độ chống trộm.", armedDesc:"🚨 ĐANG CANH GÁC! Người lạ hoặc rung lắc từ ESP32 sẽ chụp ảnh gửi Discord.", btnCapture:"📸 Chụp & Thêm Khuôn Mặt Chủ Nhân", btnArmOn:"🚨 Bật Chế Độ Chống Trộm", btnArmOff:"🛑 Tắt Chế Độ Chống Trộm", samples:"Mẫu khuôn mặt chủ nhân đã lưu", ready:"Camera sẵn sàng, hãy chụp ít nhất 1 mẫu khuôn mặt chủ nhân!", captured:"✅ Đã thêm 1 mẫu khuôn mặt!", noFace:"❌ Không thấy khuôn mặt, hãy nhìn thẳng vào camera rồi thử lại", needSample:"Hãy chụp ít nhất 1 mẫu khuôn mặt trước!", needHook:"Hãy nhập Discord Webhook trước!", stranger:"🚨 PHÁT HIỆN NGƯỜI LẠ! Đang gửi cảnh báo...", motion:"🚨 PHÁT HIỆN BẤT THƯỜNG! Đang gửi ảnh...", ownerMoving:"✅ Vừa thấy chủ nhân, bỏ qua cảnh báo", sent:"🚨 Đã gửi ảnh về Discord!", netErr:"❌ Lỗi mạng: ", online:"ESP32: Đang online", offline:"ESP32: Offline / chưa kết nối", on:"(ĐANG BẬT)", off:"(ĐÃ TẮT)", key:"Mã phòng (phải giống trong code ESP32)", hook:"Discord Webhook", save:"Lưu & kết nối", flip:"🔄 Đổi camera trước/sau", ai_loading:"AI: Đang tải mô hình nhận diện khuôn mặt...", ai_ready:"AI: Nhận diện khuôn mặt đã sẵn sàng", ai_fail:"AI: Tải mô hình thất bại, kiểm tra mạng" },
  en: { heading:"🛡️ Smart Anti-Theft Center", step1:"Step 1: Capture the owner's face (front, left and right, one photo each).", step2:"Step 2: Samples ready, you can arm the system.", armedDesc:"🚨 ARMED! Strangers or ESP32 motion will send a photo to Discord.", btnCapture:"📸 Capture Owner Face", btnArmOn:"🚨 Arm System", btnArmOff:"🛑 Disarm System", samples:"Saved owner face samples", ready:"Camera ready, capture at least 1 owner face!", captured:"✅ Owner face sample added!", noFace:"❌ No face detected, look at the camera and try again", needSample:"Capture at least 1 owner face first!", needHook:"Enter the Discord Webhook first!", stranger:"🚨 STRANGER DETECTED! Sending...", motion:"🚨 ANOMALY DETECTED! Sending photo...", ownerMoving:"✅ Owner seen recently, ignored", sent:"🚨 Snapshot sent to Discord!", netErr:"❌ Network error: ", online:"ESP32: Online", offline:"ESP32: Offline / not connected", on:"(ARMED)", off:"(DISARMED)", key:"Room key (must match ESP32 code)", hook:"Discord Webhook", save:"Save & connect", flip:"🔄 Flip camera", ai_loading:"AI: Loading face model...", ai_ready:"AI: Face recognition ready", ai_fail:"AI: Model failed to load, check network" }
};

function refresh() {
  const t = L[currentLang];
  document.getElementById('heading').innerText = t.heading;
  document.getElementById('lblKey').innerText = t.key;
  document.getElementById('lblHook').innerText = t.hook;
  document.getElementById('btnSave').innerText = t.save;
  document.getElementById('btnFlip').innerText = t.flip;
  document.getElementById('btnCapture').innerText = t.btnCapture;
  document.getElementById('samplesLabel').innerText = t.samples + ` (${ownerDescriptors.length}):`;
  btnArm.innerText = isArmed ? t.btnArmOff : t.btnArmOn;
  document.getElementById('instruction').innerText = isArmed ? t.armedDesc : (ownerDescriptors.length ? t.step2 : t.step1);
  document.getElementById('espState').innerText = espOnline ? (t.online + ' ' + (espArmed ? t.on : t.off)) : t.offline;
  document.getElementById('aiState').innerText = t['ai_' + aiMsg];
}
function setLang(l) { currentLang = l; refresh(); statusDiv.innerText = isArmed ? L[l].armedDesc : L[l].ready; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- AI nhận diện khuôn mặt ----------
async function loadModels() {
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    modelsReady = true; aiMsg = 'ready';
  } catch (e) { aiMsg = 'fail'; console.error(e); }
  refresh();
}
const detOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 });

// Quét 1 khung hình: thấy mặt chủ nhân? thấy mặt lạ?
async function scanFrame() {
  if (!modelsReady || scanning || !video.videoWidth) return null;
  scanning = true;
  try {
    const res = await faceapi.detectAllFaces(video, detOpts()).withFaceLandmarks().withFaceDescriptors();
    let owner = false, stranger = false;
    for (const r of res) {
      const best = ownerDescriptors.length
        ? Math.min(...ownerDescriptors.map(d => faceapi.euclideanDistance(d, r.descriptor)))
        : 9;
      if (best <= FACE_THRESHOLD) owner = true; else stranger = true;
    }
    if (owner) ownerLastSeen = Date.now();
    return { faces: res.length, owner, stranger };
  } catch (e) { return null; }
  finally { scanning = false; }
}
async function scanNow() {
  for (let i = 0; i < 6; i++) {
    const r = await scanFrame();
    if (r) return r;
    await sleep(300);
  }
  return null;
}
const ownerRecent = () => Date.now() - ownerLastSeen < GRACE_MS;

// ---------- Camera ----------
async function startVideo() {
  try {
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    video.srcObject = stream;
    keepAwake();
  } catch (err) { statusDiv.innerText = "Camera Error: " + err; }
}
function flipCamera() { facing = (facing === 'user') ? 'environment' : 'user'; startVideo(); }
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

// ---------- Mẫu khuôn mặt chủ nhân ----------
async function captureOwnerSample() {
  if (!modelsReady) { statusDiv.innerText = L[currentLang]['ai_' + aiMsg]; return; }
  keepAwake();
  let result = null;
  for (let i = 0; i < 6 && !result; i++) {
    if (scanning) { await sleep(300); continue; }
    scanning = true;
    try { result = await faceapi.detectSingleFace(video, detOpts()).withFaceLandmarks().withFaceDescriptor(); }
    catch (e) {}
    finally { scanning = false; }
  }
  if (!result) { statusDiv.innerText = L[currentLang].noFace; return; }

  ownerDescriptors.push(result.descriptor);
  const b = result.detection.box;
  const side = Math.max(b.width, b.height) * 1.6;
  const sx = Math.max(0, b.x + b.width / 2 - side / 2), sy = Math.max(0, b.y + b.height / 2 - side / 2);
  const tctx = thumbCanvas.getContext('2d');
  tctx.drawImage(video, sx, sy, side, side, 0, 0, 120, 120);
  const el = document.createElement('img');
  el.src = thumbCanvas.toDataURL(); el.className = 'thumbnail';
  document.getElementById('thumbs').appendChild(el);

  btnArm.style.display = 'block';
  refresh();
  statusDiv.innerText = L[currentLang].captured;
}

// ---------- Bật / tắt ----------
function setArmedState(s) {
  if (s && ownerDescriptors.length === 0) return;
  if (isArmed === s) return;
  isArmed = s;
  clearInterval(watchInterval);
  if (isArmed) {
    btnArm.className = 'main-btn btn-danger';
    statusDiv.innerText = L[currentLang].armedDesc;
    watchInterval = setInterval(watchTick, 1000);
  } else {
    btnArm.className = 'main-btn btn-success';
    statusDiv.innerText = L[currentLang].ready;
  }
  refresh();
}
function toggleSystem() {
  if (ownerDescriptors.length === 0) { alert(L[currentLang].needSample); return; }
  if (client && client.connected) client.publish(T.cmd, espArmed ? '0' : '1');
  else setArmedState(!isArmed);
}

// Mỗi giây: thấy mặt lạ mà chủ nhân chưa xuất hiện gần đây -> chụp gửi
async function watchTick() {
  if (!isArmed) return;
  const r = await scanFrame();
  if (!r) return;
  if (r.stranger && !ownerRecent() && Date.now() - lastSentTime > 15000) {
    lastSentTime = Date.now();
    statusDiv.innerText = L[currentLang].stranger;
    takePhotoAndSend("🚨 **CẢNH BÁO CHỐNG TRỘM:** Phát hiện khuôn mặt lạ lúc ");
  }
}

// ---------- Discord ----------
function takePhotoAndSend(prefix) {
  if (!webhook) { statusDiv.innerText = L[currentLang].needHook; return; }
  canvas.width = 320; canvas.height = 240;
  canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
  canvas.toBlob(blob => {
    const fd = new FormData();
    fd.append('file', blob, 'security_snapshot.jpg');
    fd.append('payload_json', JSON.stringify({ content: prefix + new Date().toLocaleTimeString() + '!' }));
    fetch(webhook, { method: 'POST', body: fd })
      .then(r => { if (r.ok) statusDiv.innerText = L[currentLang].sent; })
      .catch(e => { statusDiv.innerText = L[currentLang].netErr + e; });
  }, 'image/jpeg');
}

// ---------- MQTT ----------
function connectMqtt() {
  if (client) { try { client.end(true); } catch (e) {} client = null; }
  espOnline = false; refresh();
  if (!roomKey) return;
  const base = 'antitheft/' + roomKey;
  T = { state: base + '/state', event: base + '/event', cmd: base + '/cmd', online: base + '/online' };

  client = mqtt.connect(MQTT_URL, { clientId: 'web-' + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000, keepalive: 30 });
  client.on('connect', () => client.subscribe([T.state, T.event, T.online]));
  client.on('close', () => { espOnline = false; refresh(); });
  client.on('message', async (topic, msg) => {
    const m = msg.toString();
    if (topic === T.online) { espOnline = (m === '1'); refresh(); }
    else if (topic === T.state) {
      try { espArmed = !!JSON.parse(m).armed; } catch (e) {}
      setArmedState(espArmed); refresh();
    } else if (topic === T.event && (m === 'motion' || m === 'near')) {
      if (!espArmed) return;
      await scanNow();                       // quét thêm 1 lần ngay lúc có sự kiện
      if (ownerRecent()) { statusDiv.innerText = L[currentLang].ownerMoving; return; }
      if (Date.now() - lastSentTime > 8000) {
        lastSentTime = Date.now();
        statusDiv.innerText = L[currentLang].motion;
        takePhotoAndSend(m === 'near'
          ? "👀 **THÔNG BÁO:** Có người lạ đứng gần khu vực giám sát lúc "
          : "🚨 **CẢNH BÁO RUNG LẮC:** Có người lạ di chuyển đồ vật lúc ");
      }
    }
  });
}

function saveSettings() {
  roomKey = document.getElementById('roomKey').value.trim();
  webhook = document.getElementById('webhook').value.trim();
  try { localStorage.setItem('roomKey', roomKey); localStorage.setItem('webhook', webhook); } catch (e) {}
  connectMqtt();
}

startVideo();
refresh();
statusDiv.innerText = L[currentLang].ready;
loadModels();
connectMqtt();
</script>
</body>
</html>

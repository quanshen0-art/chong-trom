<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">智能防盜監控系統</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 20px; padding: 10px; }
        .video-container { position: relative; display: inline-block; }
        video, canvas { display: block; margin: 10px auto; border-radius: 10px; max-width: 100%; border: 2px solid #333; background: #222; }
        button { padding: 12px 20px; font-size: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #219653; }
        .lang-btn { background: #34495e; font-size: 13px; padding: 8px 12px; }
        .lang-btn:hover { background: #2c3e50; }
        #status { margin-top: 15px; font-weight: bold; color: #f1c40f; font-size: 16px; }
        .controls { margin-top: 10px; }
        #ownerPreview { width: 80px; height: 60px; border-radius: 5px; border: 2px solid #27ae60; display: none; margin: 5px auto; }
    </style>
</head>
<body>

    <!-- Đa ngôn ngữ -->
    <div>
        <button class="lang-btn" onclick="switchLanguage('zh')">🇹🇼 繁體中文</button>
        <button class="lang-btn" onclick="switchLanguage('vi')">🇻🇳 Tiếng Việt</button>
        <button class="lang-btn" onclick="switchLanguage('en')">🇬🇧 English</button>
    </div>

    <h2 id="main-heading">🛡️ 智能防盜監控站</h2>
    <p id="instruction">步驟 1：請面向相機並點擊按鈕拍下您的照片作為主人樣板。</p>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted width="320" height="240"></video>
        <!-- Canvas ẩn dùng để so sánh pixel -->
        <canvas id="hiddenCanvas" width="160" height="120" style="display:none;"></canvas>
    </div>
    <!-- Hiển thị ảnh mẫu chủ nhân đã chụp -->
    <div>
        <img id="ownerPreview" alt="Owner Sample">
    </div>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <div class="controls">
        <button id="btnTrain" onclick="captureOwner()">拍攝並註冊主人照片</button>
        <button id="btnArm" onclick="toggleSystem()" style="background: #e74c3c; display:none;">開啟防盜警戒模式</button>
    </div>

    <div id="status">相機已就緒，請註冊主人樣板！</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const btnTrain = document.getElementById('btnTrain');
        const btnArm = document.getElementById('btnArm');
        const ownerPreview = document.getElementById('ownerPreview');

        // 👉 DÁN ĐƯỜNG DẪN DISCORD WEBHOOK CỦA BẠN VÀO ĐÂY
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558912856559460404/ARuaFNfuLUFYp3kS_XOf8NQrI85ZH0Nkw1FEHxvLrjxPbC2KDgfGAduANrgrV74Y4A57";

        let ownerPixels = null;
        let isArmed = false;
        let lastSentTime = 0;
        let watchInterval = null;
        let currentLang = 'zh';

        const langData = {
            zh: {
                title: "智能防盜監控系統",
                heading: "🛡️ 智能防盜監控站",
                step1: "步驟 1：請面向相機並點擊按鈕拍下您的照片作為主人樣板。",
                step2: "步驟 2：點擊下方按鈕開啟防盜警戒模式。",
                armedDesc: "🚨 防盜警戒中！檢測到非主人（陌生人）將自動拍照發送至 Discord。",
                btnTrain: "拍攝並註冊主人照片",
                btnArmOn: "開啟防盜警戒模式",
                btnArmOff: "關閉防盜模式",
                cameraReady: "相機已就緒，請拍攝主人樣板！",
                trainSuccess: "✅ 主人照片註冊成功！現在可以開啟防盜模式了。",
                strangerAlert: "🚨 發現陌生人！正在拍照並發送警告...",
                sentSuccess: "🚨 陌生人照片已成功發送至 Discord！繼續監控...",
                netError: "❌ 網絡錯誤: "
            },
            vi: {
                title: "Hệ Thống Chống Trộm Thông Minh",
                heading: "🛡️ Trạm Chống Trộm Thông Minh",
                step1: "Bước 1: Nhìn vào camera và bấm nút để chụp ảnh mẫu chủ nhân.",
                step2: "Bước 2: Bấm nút bên dưới để bật chế độ cảnh báo chống trộm.",
                armedDesc: "🚨 ĐANG CẠNH GÁC! Nếu phát hiện người lạ khác với mẫu sẽ chụp ảnh gửi Discord.",
                btnTrain: "Chụp Ảnh Mẫu Chủ Nhân",
                btnArmOn: "Bật Chế Độ Chống Trộm",
                btnArmOff: "Tắt Chế Độ Chống Trộm",
                cameraReady: "Camera đã sẵn sàng, hãy chụp ảnh mẫu chủ nhân!",
                trainSuccess: "✅ Đã lưu ảnh mẫu chủ nhân thành công! Giờ có thể bật chống trộm.",
                strangerAlert: "🚨 PHÁT HIỆN NGƯỜI LẠ! Đang chụp ảnh và gửi cảnh báo...",
                sentSuccess: "🚨 Đã gửi ảnh kẻ lạ về Discord thành công! Tiếp tục giám sát...",
                netError: "❌ Lỗi mạng: "
            },
            en: {
                title: "Smart Anti-Theft System",
                heading: "🛡️ Smart Anti-Theft Station",
                step1: "Step 1: Look at the camera and take a photo of yourself as the owner sample.",
                step2: "Step 2: Click the button below to arm the security system.",
                armedDesc: "🚨 ARMED! Strangers differing from the owner sample will trigger Discord snapshot.",
                btnTrain: "Capture Owner Photo",
                btnArmOn: "Arm Security System",
                btnArmOff: "Disarm System",
                cameraReady: "Camera ready, please capture owner sample!",
                trainSuccess: "✅ Owner photo registered successfully! You can now arm the system.",
                strangerAlert: "🚨 STRANGER DETECTED! Taking photo and sending alert...",
                sentSuccess: "🚨 Snapshot sent to Discord! Continuing surveillance...",
                netError: "❌ Network error: "
            }
        };

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('page-title').innerText = langData[lang].title;
            document.getElementById('main-heading').innerText = langData[lang].heading;
            btnTrain.innerText = langData[lang].btnTrain;
            if (isArmed) {
                btnArm.innerText = langData[lang].btnArmOff;
                document.getElementById('instruction').innerText = langData[lang].armedDesc;
            } else if (ownerPixels) {
                document.getElementById('instruction').innerText = langData[lang].step2;
                btnArm.innerText = langData[lang].btnArmOn;
            } else {
                document.getElementById('instruction').innerText = langData[lang].step1;
            }
        }

        // Bật camera ngay lập tức
        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                statusDiv.innerText = langData[currentLang].cameraReady;
            } catch (err) {
                statusDiv.innerText = "Camera Error: " + err;
            }
        }

        startVideo();

        // Chụp và lưu ảnh mẫu chủ nhân
        function captureOwner() {
            hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const imgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            ownerPixels = imgData.data;

            // Hiển thị ảnh mẫu nhỏ lên giao diện
            canvas.width = 160;
            canvas.height = 120;
            const cCtx = canvas.getContext('2d');
            cCtx.drawImage(hiddenCanvas, 0, 0);
            ownerPreview.src = canvas.toDataURL();
            ownerPreview.style.display = "block";
            // Trả lại kích thước chuẩn cho canvas chụp ảnh gửi discord
            canvas.width = 320;
            canvas.height = 240;

            statusDiv.innerText = langData[currentLang].trainSuccess;
            btnTrain.style.display = "none";
            btnArm.style.display = "inline-block";
            btnArm.innerText = langData[currentLang].btnArmOn;
            document.getElementById('instruction').innerText = langData[currentLang].step2;
        }

        // Bật/Tắt chế độ chống trộm tự động so sánh
        function toggleSystem() {
            if (!ownerPixels) {
                alert("Please capture owner photo first!");
                return;
            }

            isArmed = !isArmed;
            if (isArmed) {
                btnArm.innerText = langData[currentLang].btnArmOff;
                btnArm.style.background = "#e74c3c";
                statusDiv.innerText = langData[currentLang].armedDesc;
                document.getElementById('instruction').innerText = langData[currentLang].armedDesc;

                // Quét và so sánh mỗi 1 giây
                watchInterval = setInterval(compareWithTaste, 1000);
            } else {
                btnArm.innerText = langData[currentLang].btnArmOn;
                btnArm.style.background = "#27ae60";
                statusDiv.innerText = langData[currentLang].cameraReady;
                document.getElementById('instruction').innerText = langData[currentLang].step2;
                clearInterval(watchInterval);
            }
        }

        // Thuật toán so sánh hình ảnh hiện tại với ảnh mẫu chủ nhân
        function compareWithTaste() {
            if (!isArmed || !ownerPixels) return;

            hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const currentImgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const pixels = currentImgData.data;

            let diffCount = 0;
            const totalPixels = hiddenCanvas.width * hiddenCanvas.height;

            for (let i = 0; i < pixels.length; i += 4) {
                const rDiff = Math.abs(pixels[i] - ownerPixels[i]);
                const gDiff = Math.abs(pixels[i+1] - ownerPixels[i+1]);
                const bDiff = Math.abs(pixels[i+2] - ownerPixels[i+2]);

                // Nếu điểm ảnh nào lệch màu quá nhiều so với ảnh chủ nhân
                if ((rDiff + gDiff + bDiff) / 3 > 45) {
                    diffCount++;
                }
            }

            // Nếu mức độ khác biệt vượt quá 35% (nghĩa là không phải chủ nhân / có người lạ xuất hiện)
            if (diffCount > totalPixels * 0.35) {
                let currentTime = Date.now();
                if (currentTime - lastSentTime > 15000) { // Giãn cách 15 giây tránh spam
                    lastSentTime = currentTime;
                    takePhotoAndSend();
                }
            }
        }

        function takePhotoAndSend() {
            statusDiv.innerText = langData[currentLang].strangerAlert;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'stranger_detected.jpg');
                formData.append('payload_json', JSON.stringify({
                    content: "🚨 **CẢNH BÁO CHỐNG TRỘM:** Phát hiện người lạ (không khớp với ảnh mẫu chủ nhân) tiếp cận lúc " + new Date().toLocaleTimeString() + "!"
                }));

                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        statusDiv.innerText = langData[currentLang].sentSuccess;
                    }
                })
                .catch(error => {
                    statusDiv.innerText = langData[currentLang].netError + error;
                });
            }, 'image/jpeg');
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">智能防盜監控系統 - 骨骼識別</title>
    <!-- Tải thư viện MediaPipe Pose và Camera Utils từ Google CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 20px; padding: 10px; }
        .video-container { position: relative; display: inline-block; }
        video, canvas { display: block; margin: 10px auto; border-radius: 10px; max-width: 100%; border: 2px solid #333; background: #222; }
        button { padding: 12px 20px; font-size: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #219653; }
        .lang-btn { background: #34495e; font-size: 13px; padding: 8px 12px; }
        .lang-btn:hover { background: #2c3e50; }
        #status { margin-top: 15px; font-weight: bold; color: #f1c40f; font-size: 16px; }
        .controls { margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Đa ngôn ngữ -->
    <div>
        <button class="lang-btn" onclick="switchLanguage('zh')">🇹🇼 繁體中文</button>
        <button class="lang-btn" onclick="switchLanguage('vi')">🇻🇳 Tiếng Việt</button>
        <button class="lang-btn" onclick="switchLanguage('en')">🇬🇧 English</button>
    </div>

    <h2 id="main-heading">🛡️ 智能防盜監控站 (骨骼姿態識別)</h2>
    <p id="instruction">步驟 1：請站在鏡頭前，點擊按鈕記錄您的身體骨骼比例作為主人。</p>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted width="320" height="240" style="display:none;"></video>
        <canvas id="output_canvas" width="320" height="240"></canvas>
    </div>

    <div class="controls">
        <button id="btnTrain" onclick="registerOwnerPose()">註冊主人體 態 (Register Owner)</button>
        <button id="btnArm" onclick="toggleSystem()" style="background: #e74c3c; display:none;">開啟防盜警戒 (Arm System)</button>
    </div>

    <div id="status">正在初始化相機與骨骼識別模型...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDiv = document.getElementById('status');
        const btnTrain = document.getElementById('btnTrain');
        const btnArm = document.getElementById('btnArm');

        // 👉 DÁN ĐƯỜNG DẪN DISCORD WEBHOOK CỦA BẠN VÀO ĐÂY
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558912856559460404/ARuaFNfuLUFYp3kS_XOf8NQrI85ZH0Nkw1FEHxvLrjxPbC2KDgfGAduANrgrV74Y4A57";

        let ownerLandmarks = null;
        let isArmed = false;
        let lastSentTime = 0;
        let currentPose = null;
        let currentLang = 'zh';

        const langData = {
            zh: {
                title: "智能防盜監控系統 - 骨骼識別",
                heading: "🛡️ 智能防盜監控站 (骨骼姿態識別)",
                step1: "步驟 1：請站在鏡頭前，點擊按鈕記錄您的身體骨骼比例作為主人。",
                step2: "步驟 2：點擊下方按鈕開啟防盜警戒模式。",
                armedDesc: "🚨 防盜警戒中！系統正通過骨骼體態識別主人，陌生人靠近將自動拍照發送至 Discord。",
                btnTrain: "註冊主人體態",
                btnArmOn: "開啟防盜警戒",
                btnArmOff: "關閉防盜警戒",
                ready: "模型已就緒！請站在鏡頭前點擊註冊主人。",
                trainSuccess: "✅ 主人體態記錄成功！現在可以開啟防盜警戒。",
                strangerAlert: "🚨 發現陌生人體2態！正在拍照並發送警告...",
                sentSuccess: "🚨 陌生人照片已成功發送至 Discord！",
                noBody: "未檢測到身體！請退後一步讓鏡頭看清全身或半身。"
            },
            vi: {
                title: "Hệ Thống Chống Trộm - Nhận Diện Khung Xương",
                heading: "🛡️ Trạm Chống Trộm (Nhận Diện Khung Xương Cơ Thể)",
                step1: "Bước 1: Đứng trước camera và bấm nút để ghi nhận tỷ lệ khung xương chủ nhân.",
                step2: "Bước 2: Bấm nút bên dưới để bật chế độ cảnh báo chống trộm.",
                armedDesc: "🚨 ĐANG CẠNH GÁC! Hệ thống nhận diện vóc dáng chủ nhân, phát hiện người lạ sẽ gửi ảnh về Discord.",
                btnTrain: "Đăng Ký Vóc Dáng Chủ Nhân",
                btnArmOn: "Bật Chế Độ Chống Trộm",
                btnArmOff: "Tắt Chế Độ Chống Trộm",
                ready: "Đã sẵn sàng! Hãy đứng trước camera và bấm đăng ký.",
                trainSuccess: "✅ Đã ghi nhận vóc dáng thành công! Có thể bật chống trộm.",
                strangerAlert: "🚨 PHÁT HIỆN NGƯỜI LẠ (Vóc dáng khác)! Đang chụp ảnh gửi Discord...",
                sentSuccess: "🚨 Đã gửi ảnh kẻ lạ về Discord thành công!",
                noBody: "Không tìm thấy cơ thể! Hãy lùi ra xa một chút để camera thấy rõ."
            },
            en: {
                title: "Smart Anti-Theft - Pose Detection",
                heading: "🛡️ Smart Anti-Theft Station (Pose Detection)",
                step1: "Step 1: Stand in front of the camera and register your body pose as owner.",
                step2: "Step 2: Click the button below to arm the system.",
                armedDesc: "🚨 ARMED! Tracking body pose. Strangers will trigger Discord snapshot.",
                btnTrain: "Register Owner Pose",
                btnArmOn: "Arm Security System",
                btnArmOff: "Disarm System",
                ready: "Models ready! Stand in front of camera and register.",
                trainSuccess: "✅ Owner pose registered successfully! You can now arm.",
                strangerAlert: "🚨 STRANGER DETECTED! Taking photo and sending alert...",
                sentSuccess: "🚨 Snapshot sent to Discord!",
                noBody: "No body detected! Step back so the camera can see you."
            }
        };

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('page-title').innerText = langData[lang].title;
            document.getElementById('main-heading').innerText = langData[lang].heading;
            btnTrain.innerText = langData[lang].btnTrain;
            if (isArmed) {
                btnArm.innerText = langData[lang].btnArmOff;
                document.getElementById('instruction').innerText = langData[lang].armedDesc;
            } else if (ownerLandmarks) {
                document.getElementById('instruction').innerText = langData[lang].step2;
                btnArm.innerText = langData[lang].btnArmOn;
            } else {
                document.getElementById('instruction').innerText = langData[lang].step1;
            }
        }

        // Khởi động MediaPipe Pose
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            // Hiển thị khung hình camera lên canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                currentPose = results.poseLandmarks;
                // Vẽ khung xương lên màn hình để trực quan
                drawConnectors(canvasCtx, currentPose, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, currentPose, {color: '#FF0000', lineWidth: 1});

                // Nếu hệ thống đang bật và đã đăng ký chủ nhân -> tiến hành so sánh vóc dáng
                if (isArmed && ownerLandmarks) {
                    checkStranger(currentPose);
                }
            }
            canvasCtx.restore();
        }

        // Bật camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({image: videoElement});
            },
            width: 320,
            height: 240
        });

        camera.start().then(() => {
            statusDiv.innerText = langData[currentLang].ready;
        });

        // 1. Đăng ký vóc dáng chủ nhân
        function registerOwnerPose() {
            if (!currentPose) {
                alert(langData[currentLang].noBody);
                return;
            }
            // Lưu lại tọa độ các khớp xương chuẩn của chủ nhân
            ownerLandmarks = JSON.parse(JSON.stringify(currentPose));
            statusDiv.innerText = langData[currentLang].trainSuccess;
            btnTrain.style.display = "none";
            btnArm.style.display = "inline-block";
            btnArm.innerText = langData[currentLang].btnArmOn;
            document.getElementById('instruction').innerText = langData[currentLang].step2;
        }

        // 2. Bật/Tắt chế độ chống trộm
        function toggleSystem() {
            if (!ownerLandmarks) {
                alert("Please register owner pose first!");
                return;
            }

            isArmed = !isArmed;
            if (isArmed) {
                btnArm.innerText = langData[currentLang].btnArmOff;
                btnArm.style.background = "#e74c3c";
                statusDiv.innerText = langData[currentLang].armedDesc;
                document.getElementById('instruction').innerText = langData[currentLang].armedDesc;
            } else {
                btnArm.innerText = langData[currentLang].btnArmOn;
                btnArm.style.background = "#27ae60";
                statusDiv.innerText = langData[currentLang].ready;
                document.getElementById('instruction').innerText = langData[currentLang].step2;
            }
        }

        // 3. Thuật toán so sánh tỷ lệ khung xương (bất chấp quần áo hay đổi hướng nhẹ)
        function checkStranger(detectedPose) {
            let totalDiff = 0;
            // So sánh các điểm khớp chính (vai, hông, khuỷu tay...)
            const keyPoints = [11, 12, 23, 24, 13, 14, 15, 16]; 
            
            for (let idx of keyPoints) {
                let p1 = ownerLandmarks[idx];
                let p2 = detectedPose[idx];
                let dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                totalDiff += dist;
            }

            let avgDiff = totalDiff / keyPoints.length;

            // Nếu độ lệch tỷ lệ khung xương vượt ngưỡng (nghĩa là vóc dáng khác hẳn chủ nhân / người lạ)
            if (avgDiff > 0.25) {
                let currentTime = Date.now();
                if (currentTime - lastSentTime > 15000) { // Giãn cách 15 giây tránh spam
                    lastSentTime = currentTime;
                    takePhotoAndSend();
                }
            }
        }

        // Chụp ảnh và gửi qua Discord Webhook
        function takePhotoAndSend() {
            statusDiv.innerText = langData[currentLang].strangerAlert;
            
            canvasElement.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'pose_stranger.jpg');
                formData.append('payload_json', JSON.stringify({
                    content: "🚨 **CẢNH BÁO CHỐNG TRỘM (Khung xương):** Phát hiện người lạ có vóc dáng khác chủ nhân tiếp cận lúc " + new Date().toLocaleTimeString() + "!"
                }));

                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        statusDiv.innerText = langData[currentLang].sentSuccess;
                    }
                })
                .catch(error => {
                    statusDiv.innerText = "Error: " + error;
                });
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
